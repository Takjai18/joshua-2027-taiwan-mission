<!DOCTYPE html>
<html lang="zh-HK" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的期望 · 約書亞團2027台灣屏東短宣</title>
    <meta name="description" content="約書亞團2027台灣屏東短宣。參加者寫低自己的期望。">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#FFFCF6">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #FFFCF6;
            --border-color: #3E3A39;
            --pink: #F2A497;
            --yellow: #F6D27A;
            --blue: #A8D3E6;
            --green: #B9DAA5;
            --border-width: 3px;
            --border-radius: 20px;
            --nav-offset: 6.75rem;
        }
        @media (min-width: 640px) {
            :root { --nav-offset: 4.5rem; }
        }
        body {
            font-family: "M PLUS Rounded 1c", sans-serif;
            background-color: var(--bg-color);
            color: var(--border-color);
            line-height: 1.6;
        }
        .pb-card {
            background-color: white;
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: 6px 6px 0px var(--border-color);
            padding: 1.5rem;
            margin-bottom: 1.25rem;
        }
        .pb-btn {
            border: var(--border-width) solid var(--border-color);
            border-radius: 9999px;
            font-weight: 700;
            box-shadow: 3px 3px 0px var(--border-color);
            transition: all 0.1s;
            color: var(--border-color);
            text-decoration: none;
        }
        .pb-btn:active, .pb-btn.is-pressed {
            box-shadow: 0px 0px 0px var(--border-color);
            transform: translate(3px, 3px);
        }
        .pb-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .field {
            width: 100%;
            border: 3px solid var(--border-color);
            border-radius: 14px;
            padding: 0.7rem 0.9rem;
            background: white;
            font: inherit;
            color: inherit;
        }
        .field:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
        .honeypot {
            position: absolute;
            left: -9999px;
            width: 1px;
            height: 1px;
            overflow: hidden;
        }
        .msg { min-height: 1.5rem; font-weight: 700; }
        .msg.error { color: #9c3b32; }
    </style>
</head>
<body class="pt-28 sm:pt-20 pb-10 px-4 md:px-8 max-w-3xl mx-auto">
    <nav class="fixed top-0 left-0 w-full bg-[#FFFCF6]/95 backdrop-blur z-50 px-4 py-3" style="border-bottom: 3px solid #3E3A39;">
        <div class="max-w-3xl mx-auto flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
            <a href="/" class="font-bold text-lg whitespace-nowrap self-start sm:self-auto">⛪ 約書亞團</a>
            <div class="flex flex-wrap gap-1.5 sm:gap-2">
                <a href="/#transport" class="pb-btn bg-[var(--blue)] px-2.5 sm:px-3 py-1 text-sm whitespace-nowrap">交通</a>
                <a href="/#itinerary" class="pb-btn bg-[var(--yellow)] px-2.5 sm:px-3 py-1 text-sm whitespace-nowrap">行程</a>
                <a href="/#prep" class="pb-btn bg-[var(--green)] px-2.5 sm:px-3 py-1 text-sm whitespace-nowrap">準備</a>
                <a href="/#prayer" class="pb-btn bg-[var(--pink)] px-2.5 sm:px-3 py-1 text-sm whitespace-nowrap">禱告</a>
                <a href="/expectations" class="pb-btn is-pressed bg-[var(--yellow)] px-2.5 sm:px-3 py-1 text-sm whitespace-nowrap" aria-current="page">期望</a>
                <a href="/#notes" class="pb-btn bg-[var(--blue)] px-2.5 sm:px-3 py-1 text-sm whitespace-nowrap">須知</a>
            </div>
        </div>
    </nav>

    <header class="mt-4 mb-6">
        <h1 class="text-3xl font-extrabold border-b-4 border-[#3E3A39] inline-block pb-1">我的期望</h1>
        <p class="mt-3 font-bold">今次短宣，你期望看見什麼、經歷什麼？寫下來，隊友都可以看到。</p>
    </header>

    <form id="hope-form" class="pb-card">
        <label class="block font-extrabold mb-1" for="name">名字</label>
        <input id="name" name="name" class="field mb-4" type="text" maxlength="20" required autocomplete="nickname" placeholder="例如：德仔">
        <label class="block font-extrabold mb-1" for="body">我的期望</label>
        <textarea id="body" name="body" class="field mb-4" rows="4" maxlength="400" required placeholder="我想……"></textarea>
        <label class="honeypot" for="website">網站</label>
        <input id="website" name="website" class="honeypot" type="text" tabindex="-1" autocomplete="off">
        <button id="submit" class="pb-btn bg-[var(--pink)] px-6 py-2 text-lg" type="submit">留低這句</button>
        <p id="form-msg" class="msg mt-3" role="status"></p>
    </form>

    <section aria-labelledby="list-title">
        <h2 id="list-title" class="text-2xl font-extrabold mb-3">大家寫了什麼</h2>
        <p id="empty" class="pb-card hidden">未有人寫。你可以做第一個。</p>
        <p id="load-error" class="pb-card hidden">暫時讀不到留言。請再整理一次頁面。</p>
        <div id="list"></div>
    </section>

    <footer class="text-center mt-8 pb-8 font-bold text-sm">
        <p><a href="/">返回短宣主頁</a></p>
        <p class="mt-2 text-xs">留言會公開顯示在這頁。請只寫你願意讓隊友看到的話。</p>
    </footer>

    <script>
        const listEl = document.getElementById("list");
        const emptyEl = document.getElementById("empty");
        const loadErrorEl = document.getElementById("load-error");
        const form = document.getElementById("hope-form");
        const formMsg = document.getElementById("form-msg");
        const submitBtn = document.getElementById("submit");

        function formatTime(iso) {
            const date = new Date(iso);
            if (Number.isNaN(date.getTime())) return "";
            return date.toLocaleString("zh-HK", {
                timeZone: "Asia/Hong_Kong",
                month: "long",
                day: "numeric",
                hour: "2-digit",
                minute: "2-digit",
                hourCycle: "h23",
            });
        }

        function cardFor(item) {
            const card = document.createElement("article");
            card.className = "pb-card";
            const name = document.createElement("h3");
            name.className = "text-xl font-extrabold";
            name.textContent = item.name;
            const body = document.createElement("p");
            body.className = "mt-1";
            body.textContent = item.body;
            const time = document.createElement("p");
            time.className = "text-sm font-bold mt-2";
            time.textContent = formatTime(item.created_at);
            card.append(name, body, time);
            return card;
        }

        function showList(items) {
            listEl.replaceChildren(...items.map(cardFor));
            emptyEl.classList.toggle("hidden", items.length > 0);
            loadErrorEl.classList.add("hidden");
        }

        async function loadList() {
            try {
                const response = await fetch("/api/expectations", { cache: "no-store" });
                if (!response.ok) throw new Error("load");
                const data = await response.json();
                showList(Array.isArray(data.expectations) ? data.expectations : []);
            } catch {
                emptyEl.classList.add("hidden");
                loadErrorEl.classList.remove("hidden");
            }
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            formMsg.textContent = "";
            formMsg.classList.remove("error");
            submitBtn.disabled = true;
            try {
                const response = await fetch("/api/expectations", {
                    method: "POST",
                    headers: { "content-type": "application/json" },
                    body: JSON.stringify({
                        name: document.getElementById("name").value,
                        body: document.getElementById("body").value,
                        website: document.getElementById("website").value,
                    }),
                });
                const data = await response.json().catch(function () { return {}; });
                if (!response.ok) {
                    formMsg.textContent = data.error || "留低失敗，請再試一次";
                    formMsg.classList.add("error");
                    return;
                }
                document.getElementById("body").value = "";
                formMsg.textContent = "已留低。隊友都可以看到。";
                if (data.expectation) {
                    loadErrorEl.classList.add("hidden");
                    emptyEl.classList.add("hidden");
                    listEl.prepend(cardFor(data.expectation));
                } else {
                    await loadList();
                }
            } catch {
                formMsg.textContent = "連不上伺服器，請再試一次";
                formMsg.classList.add("error");
            } finally {
                submitBtn.disabled = false;
            }
        });

        loadList();
    </script>
</body>
</html>
